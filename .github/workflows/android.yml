# Phase 1: build APK debug + chạy unit test trên cloud.
# Máy dev yếu KHÔNG build local — mọi verify qua job này.
# Lưu ý: runner BẮT BUỘC dùng JDK 17 (AGP 8.7.3 không hỗ trợ JDK 27 của máy dev).
name: android-ci

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Runner ubuntu-latest đã cài sẵn Android SDK (biến ANDROID_HOME có sẵn).
      # KHÔNG dùng android-actions/setup-android@v3: nó cố cài package 'tools'
      # mà Google đã xóa khỏi repo -> sdkmanager exit 1. Chỉ đảm bảo 3 package cần.
      - name: Ensure Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Build debug APK + unit tests
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
